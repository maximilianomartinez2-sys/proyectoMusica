<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Explorar</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header>
            <div class="Encabezado">
                <form class="SearchBar">
                    <input type="text" name="Search" id="Search" placeholder="Buscar...">
                </form>
                <button class="ProfileButton">Mi Perfil</button>
            </div>
            <nav class="buttons">
                <a class="Startbutton" href="index.html">Inicio</a>
                <a class="Explorebutton" href="explorar.html">Explorar</a>
                <a class="Playlistbutton" href="playlist.html">Playlist</a>
            </nav>
        </header>
        <main>
            <section class="welcome-header">
                <h1>Explorar Categorías</h1>
            </section>
            <section class="categories-grid">
                <article class="category-card">
                    <h3>Rock</h3>
                </article>
                <article class="category-card">
                    <h3>Pop</h3>
                </article>
                <article class="category-card">
                    <h3>Hip-Hop</h3>
                </article>
            </section>
        </main>
        <footer class="PlayerControls">
            <button class="ControlButton">&#x23EE</button>
            <button class="ControlButton PlayMain">&#9658</button>
            <button class="ControlButton">&#x23ED</button>
        </footer>
    </body>
</html>
