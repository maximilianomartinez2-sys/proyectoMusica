<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <script type= "module" src="app.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar sesión - Proyecto Música</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav class="buttons">
            <a href="index.html" class="Startbutton">Inicio</a>
        </nav>
        <main class="LoginMain">
            <h1>Iniciar sesión</h1>
            <form id="formLogin">
                <label for="correo">Correo electrónico</label> 
                <input type="email" id="correo" required> <!--Nos obliga a escribir el correo-->
                <p id="errorCorreo"></p> <!--Mostramos errores del correo-->
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" required> <!--Con esto ocultamos la contraseña-->
                <p id="errorContrasena"></p> <!--Mostramos errores de contraseña-->
                <button type="submit">Ingresar</button>
            </form>
            <p id="mensajeLogin"></p>
            <p>¿No tienes cuenta?
                <a href="registrar.html">Regístrate aquí</a>
            </p>
      </main>
    </body>
</html>
