<!DOCTYPE html>
<html lang="es">
<head>
    <script type="module" src="app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <div class="Encabezado">
            <form class="SearchBar">
                <input type="text" name="Search" id="Search" placeholder="Buscar...">
            </form>
            <a href="perfil.html" class="ProfileButton">Mi Perfil</a>
        </div>
        <nav class="buttons">
            <a class="Startbutton" href="index.html">Inicio</a>
            <a class="Explorebutton" href="explorar.html">Explorar</a>
            <a class="Playlistbutton" href="playlist.html">Playlist</a>
        </nav>
    </header>
    <main>
        <section class="playlist-header">
            <h1>Mis playlist</h1>
            <p>3 canciones - 9min 40 segs</p>
        </section>
        <section class="Musics">
            <article class="Music">
                <button class="PlayButton">&#9658</button>
                <div class="MusicIcon"></div>
                <div class="MusicBar"></div>
                <span class="MusicTime">3:38</span>    
            </article>
            <article class="Music">
                <button class="PlayButton">&#9658</button>
                <div class="MusicIcon"></div>
                <div class="MusicBar"></div>
                <span class="MusicTime">4:05</span>
            </article>
            <article class="Music">
                <button class="PlayButton">&#9658</button>
                <div class="MusicIcon"></div>
                <div class="MusicBar"></div>
                <span class="MusicTime">1:57</span>
            </article>
        </section>
    </main>
    <footer class="PlayerControls">
            <div class="ControlButtons">
                <button class="ControlButton BtnPrev">&#x23EE</button>
                <button class="ControlButton PlayMain">&#9658</button>
                <button class="ControlButton BtnNext">&#x23ED</button>
            </div>
            <div class="ProgressBarContainer">
                <div class="MusicBar">
                    <div class="MusicBarProgress"></div>
                </div>
                <span class="MusicTime">0:00</span>
            </div>    
        </footer>
        <script src="app.js" defer></script>
</body>
</html>
