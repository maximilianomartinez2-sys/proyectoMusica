<!DOCTYPE html>
<html lang="es">
<head>
    <script type="module" src="js/playlists.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body x-data="playlistsApp">
    <header>
        <div class="Encabezado">
            <form class="SearchBar">
                <input type="text" name="Search" id="Search" placeholder="Buscar...">
            </form>
            <button class="ProfileButton">Mi Perfil</button>
        </div>
        <nav class="buttons">
            <a class="Startbutton" href="index.html">Inicio</a>
            <a class="Explorebutton" href="explorar.html">Explorar</a>
            <a class="Playlistbutton" href="playlist.html">Playlist</a>
        </nav>
    </header>
    <main class="mx-auto max-w-4xl px-4 py-8 pb-36">
        <h1 class="mb-6 text-2xl font-bold">Mis playlists</h1>
        <div x-show="!cargando && !error" x-cloak class="mb-6">
            <p x-show="mensaje" x-text="mensaje" role="status" class="mb-3 text-green-300"></p>
            <p x-show="errorAccion" x-text="errorAccion" role="alert" class="mb-3 text-red-300"></p>
            <form @submit.prevent="crearNuevaPlaylist()" novalidate class="rounded-lg bg-zinc-800 p-4">
                <label for="nombre-nueva-playlist" class="block font-medium">
                    Nombre de la nueva playlist
                </label>
                <input id="nombre-nueva-playlist" type="text" x-model="nombreNuevaPlaylist" :disabled="guardando"
                :aria-invalid="errorNombreNueva !== ''" aria-describedby="error-nombre-nueva" 
                class="mt-1 w-full rounded border border-zinc-600 bg-zinc-900 p-2">
                <p id="error-nombre-nueva" x-show="errorNombreNueva" x-text="errorNombreNueva"
                role="alert" class="mt-2 text-sm text-red-300"></p>
                <button type="submit" :disabled="guardando" x-text="guardando ? 'Procesando...' : 'Crear playlist'"
                class="mt-3 rounded bg-red-600 px-4 py-2 text-white hover:bg-red-700 disabled:opacity-50"></button>
            </form>
        </div>
        <p x-show="cargando" x-cloak role="status">
            Cargando playlists...
        </p>
        <div x-show="!cargando && error" x-cloak role="alert">
        <p class="text-red-300" x-text="error"></p>
        <button type="button" @click="init()" class="mt-3 rounded bg-red-600 px-4 py-2 text-white hover:bg-red-700">
            Reintentar
        </button>
        </div>
        <p x-show="!cargando && !error && playlists.length===0" x-cloak role="status">
            Todavía no tienes playlists.
        </p>
        <section x-show="!cargando && !error" x-cloak class="space-y-4">
            <template x-for="playlist in playlists" :key="playlist.id">
                <article class="rounded-lg bg-zinc-800 p-4">
                    <h2 class="text-lg font-semibold" x-text="playlist.nombre"></h2>
                    <p class="text-sm text-zinc-400">
                        <span x-text="playlist.cancionIds.length"></span> canciones
                    </p>
                    <p x-show="playlist.cancionIds.length===0" class="mt-3 text-sm text-zinc-400">
                        Esta playlist está vacía.
                    </p>
                    <ul class="mt-4 space-y-2">
                        <template x-for="cancion in cancionesDePlaylists(playlist)" :key="cancion.id">
                            <li class="rounded bg-zinc-900 p-3">
                                <p class="font-medium" x-text="cancion.titulo"></p>
                                <p class="text-sm text-zinc-400" x-text="cancion.artista"></p>
                            </li>
                        </template>
                    </ul>
                </article>
            </template>
        </section>
    </main>
    <footer class="PlayerControls">
            <div class="ControlButtons">
                <button class="ControlButton BtnPrev">&#x23EE;</button>
                <button class="ControlButton PlayMain">&#9658;</button>
                <button class="ControlButton BtnNext">&#x23ED;</button>
            </div>
            <div class="ProgressBarContainer">
                <div class="MusicBar">
                    <div class="MusicBarProgress"></div>
                </div>
                <span class="MusicTime">0:00</span>
            </div>    
        </footer>
</body>
</html>
