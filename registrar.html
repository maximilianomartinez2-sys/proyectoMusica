<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="app.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Música</title>
     <link rel="stylesheet" href="style.css" />
</head>
<body>
    <nav class="buttons">
        <a href="index.html" class="Startbutton">Inicio</a>
    </nav>
    <main class="LoginMain">
    <h1>Registrarse</h1>
    <form id="formRegistro">
        <label for="nombre">Nombre de usuario:</label>
        <input type="text" id="nombre" placeholder="Ingrese su nombre de usuario" required>
        <p id="errorNombre"></p>
        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" placeholder="Ingresa tu correo" required>
        <p id="errorCorreo"></p>
        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" placeholder="Ingrese su contraseña" required>
        <p id="errorContrasena"></p>
        <button type="submit">Registrarse</button>
    </form>
    <p id="mensajeExito"></p>
    <p>¿Ya tienes cuenta?
        <a href="login.html">Inicia sesión aquí</a>
    </p>
    </main>
</body>
</html>
