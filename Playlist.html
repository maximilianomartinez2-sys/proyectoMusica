<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <div class="Encabezado">
            <form class="SearchBar">
                <input type="text" name="Search" id="Search" placeholder="Buscar...">
            </form>
            <button class="ProfileButton">Mi Perfil</button>
        </div>
        <nav class="buttons">
            <a class="Startbutton" href="index.html">Inicio</a>
            <a class="Explorebutton" href="Explorar.html">Explorar</a>
            <a class="Playlistbutton" href="Playlist.html">Playlist</a>
        </nav>
    </header>
    <main>
        <section class="playlist-header">
            <h1>Mis playlist</h1>
            <p>3 canciones - 9min 40 segs</p>
        </section>
        <section class="Musics">
            <article class="Music">
                <button class="PlayButton">&#9658</button>
                <div class="MusicIcon"></div>
                <div class="MusicBar"></div>
                <span class="MusicTime">3:38</span>    
            </article>
            <article class="Music">
                <button class="PlayButton">&#9658</button>
                <div class="MusicIcon"></div>
                <div class="MusicBar"></div>
                <span class="MusicTime">4:05</span>
            </article>
            <article class="Music">
                <button class="PlayButton">&#9658</button>
                <div class="MusicIcon"></div>
                <div class="MusicBar"></div>
                <span class="MusicTime">1:57</span>
            </article>
        </section>
    </main>
    <footer class="PlayerControls">
        <button class="ControlButton">&#x23EE</button>
        <button class="ControlButton PlayMain">&#9658</button>
        <button class="ControlButton">&#x23ED</button>

    </footer>
</body>
</html>
